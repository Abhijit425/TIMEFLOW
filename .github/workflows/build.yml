name: Build TIMEFLOW APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/TIMEFLOW-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/TIMEFLOW-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TIMEFLOW-apks
          path: dist/*.apk

      - name: Publish to GitHub Release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk --title "TIMEFLOW (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Install TIMEFLOW-release.apk on your tablet." --target "$GITHUB_SHA"
